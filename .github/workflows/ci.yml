name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Cheapest first, same order as the pre-push hook in lefthook.yml and `deno task verify`. No
      # secrets: every check here runs without a key, so a fork PR runs it safely and a deploy outage
      # never turns a PR red.
      - name: Format and lint
        run: deno task lint
      - name: Types, every file from the root
        run: deno task check
      - name: Tests
        run: deno task test
