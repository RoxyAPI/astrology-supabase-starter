# The local quality gate. Pre-push mirrors .github/workflows/ci.yml exactly, so nothing continuous
# integration would reject can reach a push.
#
# The order is fixed and it is cheapest first: formatting and lint are mechanical, types catch the
# wrong shapes across every function, the shared helpers and the tests, and the tests catch the wrong
# behaviour and the config every function must share. `deno task verify` runs the same three in one
# command.

pre-commit:
  parallel: false
  commands:
    lint:
      run: deno task lint
      priority: 1

    # The whole project, not just staged files: a change in a shared helper breaks types in a function.
    types:
      run: deno task check
      priority: 2

pre-push:
  parallel: false
  commands:
    lint:
      run: deno task lint
      priority: 1

    types:
      run: deno task check
      priority: 2

    test:
      run: deno task test
      priority: 3
