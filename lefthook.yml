# Cheapest first, the same order as CI. A two minute check should never be the thing that tells you
# about a formatting slip.
pre-commit:
  parallel: false
  commands:
    lint:
      run: deno fmt --check && deno lint
    types:
      run: deno task check

pre-push:
  parallel: false
  commands:
    verify:
      run: deno task verify
